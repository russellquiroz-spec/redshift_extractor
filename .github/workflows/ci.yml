name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # El piso declarado (requires-python = ">=3.10") y la version actual.
        # Un piso que nadie corre es un piso sin verificar (K5).
        python-version: [ "3.10", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,parquet]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (mypy)
        run: mypy

      # `integration` necesita el bastion y el cluster real; no existen en el runner.
      # Los de `sshserver` si corren: el servidor SSH de prueba es en proceso.
      - name: Tests
        run: pytest -q -m "not integration"
