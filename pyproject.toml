[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redshift-extractor"
version = "0.1.0"
description = "Internal library to extract data from Amazon Redshift via SSH tunnel"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rabbit", email = "data@company.local" }]
license = { text = "Proprietary" }

dependencies = [
  "pandas>=2.2.3",
  "psycopg2-binary>=2.9.9",
  "sshtunnel==0.4.0",
  # NO subir el techo de paramiko sin cambiar sshtunnel: sshtunnel 0.4.0 (su ultima
  # release, 2021) referencia `paramiko.DSSKey` dentro de get_keys(), que se llama en
  # cada construccion del forwarder. paramiko elimino DSSKey en 4.0.0, asi que con
  # paramiko>=4 el tunel truena con:
  #   AttributeError: module 'paramiko' has no attribute 'DSSKey'
  # Verificado 2026-08-12 con paramiko 4.0.0 y 5.0.0. Ultima compatible: 3.5.1.
  "paramiko>=3.5.0,<4",
  "keyring>=25.6.0",
  "python-dotenv==1.0.1",
  "typer>=0.12.0",
  "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
  "ruff==0.6.9",
  "mypy==1.11.2",
]

# CLI opcional (si vas a usar cli.py)
[project.scripts]
redshift-extractor = "redshift_extractor.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["redshift_extractor*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_optional = true
